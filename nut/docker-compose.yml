services:
  nut-upsd:
    image: instantlinux/nut-upsd:latest
    container_name: nut-upsd
    restart: always
    environment:
      # The UPS / driver definition lives in /opt/containers/nut/ups.conf (mounted
      # below); the image copies it to /etc/nut/ups.conf on startup. It's a file because
      # the GXT5 needs an explicit productid that this image's env config can't set.
      # NAME must match the [section] in that file so the built-in upsmon monitors it.
      NAME: gxt5
      MAXAGE: "15"
      # --- monitor account used by every upsmon (this container + the hosts) ---
      API_USER: upsmon
      # Set NUT_PASSWORD in the Portainer stack's Environment variables (or a local .env).
      API_PASSWORD: ${NUT_PASSWORD:?set NUT_PASSWORD in the stack environment}
    volumes:
      # Pre-created host file (see nut/local/ups.conf in the repo). An absolute path to a
      # real file avoids the two traps hit on this image: a read-only *directory* mount
      # makes the image's chgrp abort, and a missing bind source makes Docker create the
      # source as a directory. Portainer also does not render inline compose `configs`.
      - /opt/containers/nut/ups.conf:/etc/nut/local/ups.conf:ro
    devices:
      # Whole USB bus: survives device renumbering across reboots.
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rwm"                # allow any USB char device (major 189)
    ports:
      - "3493:3493"                  # upsd, reachable by remote NUT clients
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"

  # Web dashboard for NUT. Reaches upsd by container name on the shared stack network.
  # Connection is pre-seeded in /opt/containers/peanut/settings.yml (NUT_SERVERS -> nut-upsd:3493).
  peanut:
    image: brandawg93/peanut:latest
    container_name: peanut
    restart: always
    depends_on:
      - nut-upsd
    environment:
      WEB_USERNAME: admin
      # Set PEANUT_WEB_PASSWORD in the Portainer stack's Environment variables.
      WEB_PASSWORD: ${PEANUT_WEB_PASSWORD:?set PEANUT_WEB_PASSWORD in the stack environment}
    volumes:
      - /opt/containers/peanut:/config   # must be writable by uid/gid 1000
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"
