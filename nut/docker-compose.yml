services:
  nut-upsd:
    image: instantlinux/nut-upsd:latest
    container_name: nut-upsd
    restart: always
    environment:
      # The UPS / driver definition is supplied via the inline `ups_conf` config below
      # (the image copies /etc/nut/local/ups.conf to /etc/nut/ups.conf on startup),
      # because the GXT5 needs an explicit productid that this image's env config can't
      # set. NAME must match the [section] in that config so the built-in upsmon
      # monitors the right UPS.
      NAME: gxt5
      MAXAGE: "15"
      # --- monitor account used by every upsmon (this container + the hosts) ---
      API_USER: upsmon
      # Set NUT_PASSWORD in the Portainer stack's Environment variables (or a local .env).
      API_PASSWORD: ${NUT_PASSWORD:?set NUT_PASSWORD in the stack environment}
    configs:
      - source: ups_conf
        target: /etc/nut/local/ups.conf
    devices:
      # Whole USB bus: survives device renumbering across reboots.
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rwm"                # allow any USB char device (major 189)
    ports:
      - "3493:3493"                  # upsd, reachable by remote NUT clients
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"

configs:
  ups_conf:
    # Inlined (not a bind mount) so the stack is self-contained and Portainer's git
    # deploy can't create the mount source as a directory. The GXT5 (10af:1000) is not
    # auto-claimed by usbhid-ups — productid must be forced here.
    content: |
      [gxt5]
          driver = usbhid-ups
          port = auto
          desc = "Vertiv GXT5 (server03)"
          vendorid = 10af
          productid = 1000
          serial = "2431400101AFNC3"
