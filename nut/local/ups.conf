# GXT5 driver definition. The compose stack bind-mounts this file from the HOST at
# /opt/containers/nut/ups.conf into the container at /etc/nut/local/ups.conf (the image
# then copies it to /etc/nut/ups.conf on startup).
#
# One-time host setup on server03 (the stack does NOT copy it for you):
#   sudo mkdir -p /opt/containers/nut
#   sudo cp nut/local/ups.conf /opt/containers/nut/ups.conf
#
# Why a file (not env vars): the GXT5 (10af:1000) is not auto-claimed by usbhid-ups and
# must be forced with an explicit productid, which the image's env config can't express.
[gxt5]
    driver = usbhid-ups
    port = auto
    desc = "Vertiv GXT5 (server03)"
    vendorid = 10af
    productid = 1000
    serial = "2431400101AFNC3"
