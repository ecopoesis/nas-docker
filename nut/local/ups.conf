# Mounted into the container at /etc/nut/local/ups.conf; the image copies it to
# /etc/nut/ups.conf on startup. Needed because the GXT5 (10af:1000) is not auto-claimed
# by usbhid-ups — it must be forced with an explicit productid, which the image's
# env-based config can't express.
[gxt5]
    driver = usbhid-ups
    port = auto
    desc = "Vertiv GXT5 (server03)"
    vendorid = 10af
    productid = 1000
    serial = "2431400101AFNC3"
